        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Anton&display=swap');

        .calc-app {
          position: relative;
          color-scheme: dark;
          --bg: #101216;
          --surface: #1A1D23;
          --border: #2C3038;
          --ink: #EDEEF1;
          --ink-soft: #9BA3B0;
          --ink-faint: #6B7280;
          --accent: #9490F5;
          --accent-muted: #55519F;
          --accent-dim: #2E2C5A;
          --on-accent-muted: #F2F1FF;
          --accent-soft: #23223D;
          --accent-solid: #4F46E5;
          --loss: #FF7B84;
          --loss-soft: #3A1F22;
          --gain: #4ADE80;
          --gain-soft: #163325;
          --amber: #F2B84B;
          --amber-soft: #3A2E14;
          --panel-dark: #08090B;

          font-family: 'Inter', sans-serif;
          color: var(--ink);
          background: var(--bg);
          min-height: 100%;
          width: 100%;
          box-sizing: border-box;
        }
        .calc-app *, .calc-app *::before, .calc-app *::after { box-sizing: border-box; }

        .shell {
          position: relative;
          z-index: 1;
          max-width: 800px;
          margin: 0 auto;
          padding: 165px 24px 80px;
        }

        .hero-band {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          z-index: 0;
          height: 221px;
          background-size: cover;
          background-position: center 35%;
        }
        .hero-band-fade {
          position: absolute;
          inset: 0;
          background: linear-gradient(to bottom, transparent 0, transparent 15px, var(--bg) 221px);
        }
        @media (max-width: 640px) {
          .shell { padding-top: 125px; }
          .hero-band { height: 172px; }
          .hero-band-fade { background: linear-gradient(to bottom, transparent 0, transparent 10px, var(--bg) 172px); }
        }
        .hero { margin-bottom: 40px; }
        .hero h1 {
          font-family: 'Space Grotesk', sans-serif;
          font-weight: 700;
          font-size: clamp(34px, 5.4vw, 50px);
          line-height: 1.08;
          letter-spacing: -0.01em;
          color: var(--ink);
          margin: 0 0 18px;
        }
        .hero-sub {
          font-size: 16.5px;
          line-height: 1.6;
          color: var(--ink-soft);
          max-width: 560px;
          margin: 0;
        }

        .card {
          background: var(--surface);
          border: 1px solid var(--accent-muted);
          border-radius: 16px;
          padding: 28px 28px 30px;
          margin-bottom: 20px;
          box-shadow: 0 1px 2px rgba(20,23,31,0.04);
        }
        .card-dark {
          background: var(--panel-dark);
        }
        .card-dark .card-sub, .card-dark .card-head h2 { color: #fff; }

        .card-head {
          display: flex;
          align-items: flex-start;
          gap: 14px;
          margin-bottom: 24px;
        }
        .card-head h2 {
          font-family: 'Space Grotesk', sans-serif;
          font-weight: 700;
          font-size: 19px;
          color: var(--ink);
          margin: 0 0 3px;
        }
        .card-sub {
          font-size: 13.5px;
          color: var(--ink-soft);
          margin: 0;
        }

        .field-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 0 18px;
          margin-top: 18px;
        }
        @media (min-width: 640px) {
          .field-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .field { display: flex; flex-direction: column; gap: 0; min-width: 0; padding-bottom: 26px; }
        /* Subgrid: each field spans two shared rows (input / title+hint), so wrapped
           text grows the bottom of the row for every field beside it; titles stay tight under inputs. */
        @supports (grid-template-rows: subgrid) {
          .field-grid > .field {
            display: grid;
            grid-template-rows: subgrid;
            grid-row: span 2;
            row-gap: 0;
          }
        }
        .field-text { display: block; min-width: 0; padding-left: 4px; }
        .field-label {
          display: block;
          font-size: 12.5px;
          font-weight: 600;
          color: var(--ink);
          line-height: 1.3;
          margin-top: 6px; /* titles sit just under their fields */
        }
        .field-hint {
          display: block;
          font-size: 11px;
          line-height: 1.35;
          color: var(--ink-faint);
          margin-top: 1px;
        }

        .number-field {
          display: flex;
          align-items: center;
          gap: 4px;
          background: var(--bg);
          border: 1.5px solid var(--border);
          border-radius: 8px;
          padding: 8px 10px;
          transition: border-color 0.12s, background 0.12s;
        }
        .number-field:focus-within { border-color: var(--accent); background: var(--surface); }
        .number-field input {
          border: none;
          outline: none;
          width: 100%;
          background: transparent;
