        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

        .shell {

        }

        .hero-band {

        .hero { margin-bottom: 40px; }

          color: var(--ink);

        }
        .hero-sub {
          font-size: 16.5px;

          max-width: 560px;
          margin: 0;
        }

        .card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 28px 28px 30px;
          margin-bottom: 20px;
          box-shadow: 0 1px 2px rgba(20,23,31,0.04);

        .card-dark {

        .card-head {

          gap: 14px;

        .card-sub {

          gap: 0 18px;
          margin-top: 18px;

        @media (min-width: 640px) {
          .field-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; padding-bottom: 16px; }
        /* Subgrid: each field spans three shared rows (label / hint / input), so
           wrapped text grows the row for every field beside it and inputs stay aligned. */
        @supports (grid-template-rows: subgrid) {

            grid-row: span 3;
            row-gap: 0;

        .number-field {

          gap: 1px;

        .stepper button {

          justify-content: center;
          cursor: pointer;
          border-radius: 3px;
          padding: 0;
          transition: background 0.12s, color 0.12s;

        .stepper button:hover { background: var(--accent); color: #fff; }
        .stepper svg { pointer-events: none; }

          margin: 8px 0 0;
        }
        .micro-note.center { text-align: center; margin-top: 14px; }

          flex-direction: column;
          align-items: center;
          gap: 8px;

        .dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }

        .col-thumb { position: relative; display: flex; align-items: flex-start; }

        .apply-row { display: flex; justify-content: center; margin-top: 20px; }

          height: 14px;

          border: 2px solid var(--border);
          border-top-color: var(--accent);

        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-panel {

          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 16px 18px 18px;
        }
        .result-head {

          flex-wrap: wrap;
          gap: 10px;
          font-size: 13px;
          color: var(--ink-soft);
          margin-bottom: 12px;
        }

        .games-table { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
        .games-row {
          display: grid;

        .games-row.header-row { padding: 8px 8px; background: var(--bg); border-radius: 8px 8px 0 0; }
        .col-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 700; }
        .cell-text {

        .note-cell { display: flex; align-items: center; justify-content: center; }

        .note-tooltip {

        .stat-tile { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }

        .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 6px; }
